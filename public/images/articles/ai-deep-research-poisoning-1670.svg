<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img">
  <title>Як одне речення на Reddit чи Wikipedia потрапляє у звіт AI deep research</title>
  <desc>Зліва стопка джерел з одним отруєним коментарем, стрілка веде до AI-агента, праворуч звіт із підсвіченою згадкою бренду.</desc>

  <rect width="1200" height="630" fill="#F4F1EA"/>
  <rect width="1200" height="10" fill="#E23B3B"/>

  <text x="60" y="84" font-size="40" font-weight="700" fill="#1A1A1A">Одне речення труїть весь звіт AI</text>
  <text x="60" y="122" font-size="21" fill="#6F6A60">deep research читає десятки сторінок, але повторює одні й ті самі</text>

  <text x="60" y="205" font-size="18" font-weight="700" fill="#8A8377" letter-spacing="1">ДЖЕРЕЛА</text>

  <rect x="80" y="232" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#DAD4C7" stroke-width="2" transform="rotate(-4 190 292)"/>
  <rect x="70" y="250" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#DAD4C7" stroke-width="2" transform="rotate(3 180 310)"/>

  <rect x="64" y="228" width="232" height="128" rx="12" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="2"/>
  <circle cx="92" cy="258" r="13" fill="#FF4500"/>
  <text x="92" y="263" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">r</text>
  <text x="116" y="263" font-size="18" font-weight="700" fill="#1A1A1A">Reddit</text>
  <rect x="86" y="284" width="188" height="9" rx="4" fill="#E7E2D6"/>
  <rect x="86" y="302" width="160" height="9" rx="4" fill="#E7E2D6"/>
  <rect x="82" y="320" width="196" height="22" rx="6" fill="#FCE4E4" stroke="#E23B3B" stroke-width="2"/>
  <text x="92" y="336" font-size="13" font-weight="700" fill="#C42B2B">☠ +8–20 слів</text>

  <rect x="64" y="376" width="232" height="96" rx="12" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="2"/>
  <circle cx="92" cy="404" r="13" fill="#202122"/>
  <text x="92" y="409" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">W</text>
  <text x="116" y="409" font-size="18" font-weight="700" fill="#1A1A1A">Wikipedia</text>
  <rect x="86" y="428" width="188" height="9" rx="4" fill="#E7E2D6"/>
  <rect x="86" y="446" width="150" height="9" rx="4" fill="#E7E2D6"/>

  <line x1="312" y1="350" x2="392" y2="350" stroke="#B6AF9F" stroke-width="4"/>
  <path d="M392 350 l-16 -9 v18 z" fill="#B6AF9F"/>

  <rect x="412" y="250" width="270" height="200" rx="16" fill="#1A1A1A"/>
  <text x="547" y="300" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI deep research</text>
  <text x="547" y="326" font-size="14" fill="#A9A9A9" text-anchor="middle">OpenAI · Gemini · STORM</text>
  <circle cx="547" cy="385" r="34" fill="none" stroke="#3A3A3A" stroke-width="6"/>
  <path d="M547 351 a34 34 0 0 1 29 17" fill="none" stroke="#E23B3B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="547" cy="385" r="6" fill="#E23B3B"/>

  <line x1="694" y1="350" x2="774" y2="350" stroke="#B6AF9F" stroke-width="4"/>
  <path d="M774 350 l-16 -9 v18 z" fill="#B6AF9F"/>

  <text x="800" y="205" font-size="18" font-weight="700" fill="#8A8377" letter-spacing="1">ЗВІТ</text>
  <rect x="800" y="228" width="340" height="244" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="2"/>
  <rect x="824" y="258" width="200" height="14" rx="7" fill="#1A1A1A"/>
  <rect x="824" y="290" width="292" height="10" rx="5" fill="#E7E2D6"/>
  <rect x="824" y="312" width="292" height="10" rx="5" fill="#E7E2D6"/>
  <rect x="816" y="334" width="308" height="30" rx="8" fill="#FCE4E4" stroke="#E23B3B" stroke-width="2"/>
  <text x="830" y="355" font-size="16" font-weight="700" fill="#C42B2B">…радимо ваш бренд…</text>
  <rect x="824" y="380" width="292" height="10" rx="5" fill="#E7E2D6"/>
  <rect x="824" y="402" width="240" height="10" rx="5" fill="#E7E2D6"/>
  <rect x="824" y="424" width="292" height="10" rx="5" fill="#E7E2D6"/>

  <text x="800" y="520" font-size="22" font-weight="700" fill="#C42B2B">до 37%</text>
  <text x="800" y="546" font-size="14" fill="#6F6A60">звітів згадують</text>
  <text x="800" y="563" font-size="14" fill="#6F6A60">підсунутий бренд</text>

  <text x="60" y="520" font-size="22" font-weight="700" fill="#1A1A1A">48%</text>
  <text x="60" y="546" font-size="14" fill="#6F6A60">запитів теми тягнуть</text>
  <text x="60" y="563" font-size="14" fill="#6F6A60">одну й ту саму сторінку</text>

  <text x="412" y="520" font-size="22" font-weight="700" fill="#1A1A1A">0 з 3</text>
  <text x="412" y="546" font-size="14" fill="#6F6A60">перевірених захистів</text>
  <text x="412" y="563" font-size="14" fill="#6F6A60">спрацювали</text>

  <text x="1140" y="612" font-size="14" fill="#B6AF9F" text-anchor="end">seobaza.com.ua · дослідження Cornell</text>
</svg>
